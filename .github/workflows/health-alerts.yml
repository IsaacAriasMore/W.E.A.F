name: Free failure alerts

on:
  workflow_run:
    workflows: [CI, E2E, Lighthouse]
    types: [completed]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alert-workflow-failure:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_TITLE: "[health-alert] ${{ github.event.workflow_run.name }} failed on ${{ github.event.workflow_run.head_branch }}"
    steps:
      - name: Open one deduplicated issue
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ALERT_TITLE in:title" --json title --jq '.[] | select(.title == env.ALERT_TITLE) | .title')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "A required free check failed. Inspect the linked Actions run; no credentials or request payloads are copied into this issue. Run: ${{ github.event.workflow_run.html_url }}"
          fi

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ALERT_TITLE: "[health-alert] W.E.A.F production health check failed"
    steps:
      - name: Check public home without credentials
        id: health
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 20 https://weaf.vercel.app/ -o /dev/null
      - name: Open one deduplicated issue
        if: steps.health.outcome == 'failure'
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$ALERT_TITLE in:title" --json title --jq '.[] | select(.title == env.ALERT_TITLE) | .title')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "The anonymous public-home health check failed. No secrets, cookies or authenticated endpoints were used."
          fi
